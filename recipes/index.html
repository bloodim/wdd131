<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="recipe-book.png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Recipes Book</title>
</head>
<body>
    <header>
        <img src="recipe-book.png" alt="Recipe Book Cover" class="cover-image">
        <h1>Recipe Book</h1>
    </header>

    <main>
        <section class="search">
            <input type="search" placeholder="Find a recipe" id="searchInput">
            <img src="search.svg" alt="search-icon" class="search-icon">
        </section>
        <hr>
        <section class="recipes">
            <section class="recipe">
                <img src="apple-crisp.jpg" alt="Apple Crisp" class="recipe-image">
                <section class="details">
                    <p class="type">dessert</p>
                    <h2>Apple Crisp</h2>
                    <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                    >
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
                </section>
            </section>  
        </section>
    </main>
    <footer>                
                        
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                
        
         <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>  
                
    </footer>
  
</body>
</html>
