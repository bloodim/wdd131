<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <link rel="icon" href="icons8-ticket-gradient-32.png">
    <script src="eventform.js" defer></script>
    <title>Event Tickets</title>
</head>
<body>
    <main>
        <h1>Event Ticket</h1>

        <form id="eventForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required />
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required />
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
            </div>

            <div class="field">
                <label for="ticketType">Type</label>
                <select id="ticketType" name="ticketType" required>
                <option value="">Choose one</option>
                <option value="student">Student</option>
                <option value="guest">Guest</option>
                </select>
            </div>

            <div class="field">
                <label for="eventDate">Available Start Date</label>
                <input id="eventDate" name="eventDate" type="date" required />
            </div>

            <div class="field full" id="studentID">
                <label for="id">Student ID</label>
                <input id="id" name="studentID" type="text" maxlength="9"  />
            </div>

            <div class="field full" id="accessCode">
                <label for="code">Access Code</label>
                <input id="code" name="accessCode" type="text"  />
            </div>

            <button class="full" type="submit">Create Ticket</button>

        </form>

        <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>
